services:

  postgres_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appointment_db}
      POSTGRES_USER: ${POSTGRES_USER:-db_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-db_password_123}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    profiles: ["full-stack"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres_db
      DB_NAME: ${POSTGRES_DB:-appointment_db}
      DB_USER: ${POSTGRES_USER:-db_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      DB_PORT: 5432
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-}
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"
    volumes:
      - ${UPLOADS_PATH:-./uploads}:/app/uploads
    depends_on:
      postgres_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    profiles: ["full-stack"]
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_API_URL: /api
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${WEB_PORT:-80}:8080"
    volumes:
      - ./deploy/nginx.local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  migrate:
    profiles: ["maintenance"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["node", "src/scripts/migrate.js"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DB_HOST: postgres_db
      DB_NAME: ${POSTGRES_DB:-appointment_db}
      DB_USER: ${POSTGRES_USER:-db_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      DB_PORT: 5432
    depends_on:
      postgres_db:
        condition: service_healthy

volumes:
  postgres_data: