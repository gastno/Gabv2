name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm audit --omit=dev --prefix backend
      - run: npm test --prefix backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm audit --omit=dev --prefix frontend
      - run: npm test --prefix frontend -- --watchAll=false
        env:
          CI: true
      - run: npm run build --prefix frontend

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --prefix mobile
      - run: npm run typecheck --prefix mobile
      - run: npm test --prefix mobile
      - run: npm run doctor --prefix mobile
      - run: npm run export --prefix mobile

  database-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r database/requirements.txt
      - run: python -m py_compile database/seed_db.py

  containers:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: gabv2_ci
      POSTGRES_USER: gabv2_ci
      CORS_ORIGINS: https://www.example.test
      PUBLIC_API_URL: https://api.example.test/api
      API_PORT: 5500
      WEB_PORT: 8088
      API_BIND_ADDRESS: 127.0.0.1
      WEB_BIND_ADDRESS: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral container secrets
        run: |
          printf '%s' 'ci-only-database-password' > "$RUNNER_TEMP/postgres_password"
          printf '%064d' 1 > "$RUNNER_TEMP/jwt_secret"
          echo "POSTGRES_PASSWORD_FILE=$RUNNER_TEMP/postgres_password" >> "$GITHUB_ENV"
          echo "JWT_SECRET_FILE=$RUNNER_TEMP/jwt_secret" >> "$GITHUB_ENV"
      - name: Validate Compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f compose.production.yml config --quiet
      - name: Initialize and migrate clean database
        run: |
          docker compose -f compose.production.yml up -d postgres_db
          docker compose -f compose.production.yml --profile maintenance run --rm migrate
          docker compose -f compose.production.yml exec -T postgres_db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "DROP TABLE schema_migrations; CREATE TABLE staff_schedules (id BIGINT PRIMARY KEY, shift_start TIME NOT NULL, shift_end TIME NOT NULL)"
          docker compose -f compose.production.yml --profile maintenance run --rm migrate
      - name: Build and smoke-test production containers
        run: |
          docker compose -f compose.production.yml up -d --build api web
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5500/health/ready > /dev/null \
              && curl -fsS http://127.0.0.1:8088/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f compose.production.yml ps
          docker compose -f compose.production.yml logs
          exit 1
      - name: Stop containers without deleting persistent volumes
        if: always()
        run: docker compose -f compose.production.yml down
